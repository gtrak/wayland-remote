name: Release

on:
  push:
    tags:
      - 'v*'

env:
  CARGO_TERM_COLOR: always

jobs:
  create-release:
    name: Create Release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          draft: true
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  build-server:
    name: Build Server (Linux)
    runs-on: ubuntu-latest
    needs: create-release
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.75
      
      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libwayland-dev libxkbcommon-dev
      
      - name: Build release
        run: cargo build --package wayland-remote-server --release
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wayland-remote-server-linux
          path: target/release/wayland-remote-server

  build-viewer:
    name: Build Viewer (Windows)
    runs-on: windows-latest
    needs: create-release
    steps:
      - uses: actions/checkout@v4
      
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: 1.75
      
      - name: Build release
        run: cargo build --package wayland-remote-viewer --release
      
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: wayland-remote-viewer-windows
          path: target/release/wayland-remote-viewer.exe
