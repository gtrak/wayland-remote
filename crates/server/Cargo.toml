[package]
name = "wayland-remote-server"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "Headless Wayland compositor server with frame streaming"
rust-version.workspace = true
repository.workspace = true

[[bin]]
name = "wayland-remote-server"
path = "src/main.rs"

[dependencies]
# Workspace dependencies
tokio = { workspace = true }
tracing = { workspace = true }
tracing-subscriber = { workspace = true }
anyhow = { workspace = true }
thiserror = { workspace = true }
# Binary protocol framing
bytes = "1.9"

# Smithay with wayland_frontend feature for core protocol support
# Following Smallvil pattern from research
smithay = { workspace = true, default-features = false, features = ["wayland_frontend", "renderer_pixman"] }

# Event loop and Wayland server infrastructure
calloop = "0.14.0"
wayland-server = "0.31.9"
wayland-protocols = "0.32.8"

[dev-dependencies]
# Testing utilities for integration tests
wayland-client = "0.31"
wayland-protocols = { version = "0.32", features = ["client"] }
tempfile = "3"
